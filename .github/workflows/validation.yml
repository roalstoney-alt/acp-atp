name: Synthetic validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.0"

      - name: Unit tests
        run: python3 -B -m unittest discover -s tests

      - name: PATL demo
        run: python3 -B -m trust_layer.demo_runner

      - name: Boundary Challenge
        run: python3 -B -m challenge.run_boundary_challenge

      - name: Adapter demo
        run: python3 -B -m integrations.selected_framework.demo

